services:
  postgres:
    image: postgres:16-alpine
    container_name: infra360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: infra360
      POSTGRES_PASSWORD: infra360
      POSTGRES_DB: infra360
    ports:
      - "5432:5432"
    volumes:
      - infra360_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra360"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  infra360_postgres_data:
